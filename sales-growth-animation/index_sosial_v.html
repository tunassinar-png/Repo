  .chip { position: absolute; left: 0; top: 0; opacity: 0; display: flex; align-items: center; gap: 14px; padding: 12px 34px 12px 16px; border-radius: 999px;

  .chip.tt { background: #08080d; border: 2px solid rgba(255,255,255,.22); text-shadow: -2px 0 #25f4ee, 2px 0 #fe2c55; box-shadow: 0 16px 38px rgba(0,0,0,.5), 0 0 34px rgba(254,44,85,.35); }
  .chip.tt .ic { background: #111; font-size: 40px; text-shadow: -2px 0 #25f4ee, 2px 0 #fe2c55; }
  .ring { position: absolute; left: 0; top: 0; width: 330px; height: 92px; border-radius: 999px; border: 4px solid rgba(255,214,120,.9); opacity: 0; pointer-events: none; }
